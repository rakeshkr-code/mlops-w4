name: CI Pipeline - Main Branch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure DVC
        run: |
          dvc remote modify myremote credentialpath $GOOGLE_APPLICATION_CREDENTIALS
      
      - name: Pull data and model from DVC
        run: |
          dvc pull
      
      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term --cov-report=xml --junitxml=test_results.xml
      
      - name: Setup CML
        uses: iterative/setup-cml@v2
      
      - name: Generate Production CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Production Test Results Report - Main Branch" > report.md
          echo "" >> report.md
          echo "## ✅ CI/CD Pipeline Status" >> report.md
          echo "" >> report.md
          echo "All tests passed successfully!" >> report.md
          echo "" >> report.md
          
          echo "## Test Coverage" >> report.md
          echo "" >> report.md
          pytest tests/ --cov=src --cov-report=term >> report.md 2>&1 || true
          echo "" >> report.md
          
          echo "## Detailed Test Results" >> report.md
          echo "" >> report.md
          pytest tests/ -v >> report.md 2>&1 || true
          echo "" >> report.md
          
          # Add model metrics
          if [ -f "metrics.json" ]; then
            echo "## 📊 Model Performance Metrics" >> report.md
            echo "" >> report.md
            echo "\`\`\`json" >> report.md
            cat metrics.json >> report.md
            echo "\`\`\`" >> report.md
            echo "" >> report.md
          fi
          
          # Add confusion matrix if available
          if [ -f "outputs/*/confusion_matrix.png" ]; then
            echo "## Confusion Matrix" >> report.md
            cml publish outputs/*/confusion_matrix.png --md >> report.md
          fi
          
          echo "---" >> report.md
          echo "*Production deployment ready*" >> report.md
          echo "*Generated on: $(date)*" >> report.md
          
          cml comment create report.md
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_results.xml
            htmlcov/
